<body data-bg="default">
<header class="top">
<div><h1 class="logo">JX<i>STAB</i></h1><p class="sub" data-i="h1">JXStab — симулятор стабилизации телефонов</p></div>
<span id="fps">60</span>
<select id="lang" aria-label="Language"></select>
</header>

<main id="stage">
<canvas id="fx"></canvas>
<img id="phone" alt="" draggable="false">
<p id="hint" data-i="hint">Крути телефон пальцем по кругу</p>
<div id="info"><span id="cpu"></span><span id="cam"></span></div>
</main>

<nav class="dock">
<button data-open="s-phone"><b>📱</b><span data-i="phone">Телефон</span></button>
<button id="spin"><b>⟳</b><span data-i="spin">Спин</span></button>
<button data-open="s-fx"><b>✦</b><span data-i="fx">FX</span></button>
<button data-open="s-set"><b>⚙</b><span data-i="set">Ещё</span></button>
</nav>

<div class="sheet" id="s-phone" hidden><div class="box">
<input type="text" id="q" placeholder="🔍" maxlength="32" autocomplete="off">
<div id="pl"></div>
<button class="b a" data-open="s-add">＋ <span data-i="add">Добавить телефон</span></button>
</div></div>

<div class="sheet" id="s-add" hidden><div class="box">
<label><span data-i="name">Модель</span><input type="text" id="nm" maxlength="32" autocomplete="off" placeholder="iPhone 17 Pro"></label>
<label class="file"><span>PNG · JPG · WEBP</span><input type="file" id="file" accept=".png,.jpg,.jpeg,.jfif,.webp,.gif,.bmp,.avif,image/*"></label>
<div id="pk" hidden><img id="pv" alt="" draggable="false"><i id="mrk" hidden></i></div>
<div class="g2"><input type="text" id="c1" maxlength="32" autocomplete="off" placeholder="CPU"><input type="text" id="c2" maxlength="32" autocomplete="off" placeholder="📷"></div>
<button class="b a" id="sv" data-i="save">Сохранить</button>
</div></div>

<div class="sheet" id="s-fx" hidden><div class="box">
<div class="g4">
<button class="b on" data-fx="none" data-i="none">Нет</button>
<button class="b" data-fx="snow" data-i="snow">Снег</button>
<button class="b" data-fx="text">JX</button>
<button class="b" data-fx="phones">📱</button>
</div>
<label class="row"><span data-i="glow">Rage Glow</span><input type="checkbox" id="glow"></label>
<div class="lbl" data-i="prop">Пропеллер</div>
<div class="row"><input type="number" id="pt" value="5" min="1" max="60"><input type="range" id="pw" min="1" max="50" value="25"></div>
<button class="b r" id="go" data-i="go">Старт</button>
<div class="lbl" data-i="music">Музыка</div>
<div class="g2"><button class="b" data-t="UNDER_YOUR_SPELL.mp3">UNDER YOUR SPELL</button><button class="b" data-t="REVOLTA_DO_CHAPEU.mp3">REVOLTA DO CHAPEU</button></div>
<audio id="au" loop></audio>
</div></div>

<div class="sheet" id="s-set" hidden><div class="box">
<label><span data-i="bg">Фон</span><select id="bg"><option value="default">Black</option><option value="neon">Neon</option><option value="space">Space</option><option value="sunset">Sunset</option><option value="grid">Blueprint</option></select></label>
<label><span data-i="stretch">Ширина</span><input type="range" id="stretch" min="0.5" max="2" step="0.1" value="1"></label>
<label class="row"><span data-i="light">Светлая тема</span><input type="checkbox" id="light"></label>
<label class="row"><span data-i="tilt">3D наклон</span><input type="checkbox" id="tilt"></label>
<label class="row"><span data-i="ois">Стабилизация OIS</span><input type="checkbox" id="ois"></label>
<label class="row"><span data-i="lite">Lite режим</span><input type="checkbox" id="lite"></label>
<div class="lbl" data-i="photo">Фото режим</div>
<div class="g2"><input type="text" id="nick" maxlength="24" autocomplete="off" data-p="nick"><button class="b a" id="mk">📷</button></div>
<button class="b" data-open="s-about" data-i="about">О проекте</button>
</div></div>

<div class="sheet" id="s-about" hidden><div class="box ab">

<div class="lbl" data-i="donate">Поддержать</div>
<p>2200 7021 0579 3918</p>
<button class="b" data-close data-i="close">Закрыть</button>
</div></div>

<div id="toast" role="status"></div>
